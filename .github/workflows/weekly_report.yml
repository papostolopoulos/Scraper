name: Weekly Report

on:
  workflow_dispatch:
    inputs:
      days:
        description: Number of days to include in the report window
        required: false
        default: '7'
  schedule:
    - cron: '0 6 * * 1' # Every Monday 06:00 UTC

jobs:
  generate-weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run weekly report
        env:
          DAYS: ${{ inputs.days || 7 }}
        run: |
          python scripts/run_weekly_report.py --days "$DAYS"

      - name: Upload weekly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: |
            snapshots/provenance_diversity.json
            snapshots/weekly_summary.md
