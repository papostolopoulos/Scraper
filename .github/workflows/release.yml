name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine release tag
        id: tagvar
        run: |
          git fetch --tags --force
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [[ "$TAG" != v* ]]; then
            TAG=$(git describe --tags --abbrev=0)
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel & sdist
        run: |
          python -m build

      - name: Generate weekly summary (optional)
        continue-on-error: true
        run: |
          python scripts/run_weekly_report.py --days 7 || true

      - name: Create GitHub Release (auto notes) with dist/*
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagvar.outputs.tag }}
          name: ${{ steps.tagvar.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach weekly summary if present
        if: ${{ hashFiles('snapshots/weekly_summary.md') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagvar.outputs.tag }}
          files: |
            snapshots/weekly_summary.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/*
