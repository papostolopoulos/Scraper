[project]
name = "jobminer"
version = "0.2.1"
description = "Job collection and scoring pipeline"
readme = "scraper/README.md"
requires-python = ">=3.11"
dependencies = [
	"pydantic>=2.6",
	"pandas>=2.1",
	"openpyxl>=3.1",
	"pyyaml>=6.0",
	"rapidfuzz>=3.0",
	"playwright>=1.44",
	"sentence-transformers>=2.6; python_version>='3.11'",  # optional semantic
	"fastapi>=0.115",
	"uvicorn[standard]>=0.30",
	"httpx>=0.27",
	"pypdf>=4.2",
	"python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest","pytest-cov","pytest-timeout","pytest-xdist","pytest-rerunfailures","ruff","mypy","hypothesis","pre-commit"]

[project.scripts]
jobminer-export = "scraper.scripts.run_export:main"
jobminer-pipeline = "scraper.scripts.run_pipeline:main"
jobminer-cli = "scraper.scripts.job_cli:main"
jobminer-score = "scraper.scripts.run_score:main"

[build-system]
requires = ["setuptools>=67","wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["scraper", "scraper.jobminer", "scraper.jobminer.sources", "scraper.scripts"]
package-dir = {"scraper" = "scraper"}
include-package-data = true

[tool.setuptools.package-data]
"scraper" = ["config/*.yml"]
[tool.mypy]
python_version = "3.11"
plugins = []
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv","data","exports","tests","dist","htmlcov","snapshots"]

[tool.ruff.lint]
# Keep linting focused on errors that impact correctness in CI.
# Style and refactor rules are valuable locally but too noisy for CI right now.
select = ["E","F"]
# Ignore long lines and single-line compound statements for now; ignore unused imports/vars in modules
# where tests or optional features purposely trigger them.
ignore = ["E401","E402","E501","E701","E702","E741","F401","F841"]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["jobminer"]

[tool.ruff.lint.per-file-ignores]
"scraper/tests/*" = ["S101","PL"]

[tool.coverage.run]
branch = true
source = ["scraper"]
omit = ["scraper/tests/*","scraper/web/index.html"]

[tool.coverage.report]
fail_under = 0  # placeholder; will be bumped by +2% gate script later
skip_empty = true
show_missing = true
